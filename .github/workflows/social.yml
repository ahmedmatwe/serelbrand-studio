# Posts the Shorts whose time has come as Reels on the Facebook Page + Instagram (see src/publishing/social.ts).
# Light and fast: no rendering, no database — the queue lives in the "social-queue" release.
name: social

on:
  schedule:
    - cron: '4 5-21 * * *'   # hourly 07:00–23:00 Cairo (posts land a few minutes after their slot; saves Actions minutes)
  workflow_dispatch:
    inputs:
      check:
        description: 'Only check the Facebook/Instagram connection (posts nothing)'
        type: boolean
        default: false

concurrency:
  group: social
  cancel-in-progress: false

permissions:
  contents: write   # read/delete queued videos (release assets)

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRY_RUN: 'false'
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      GITHUB_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DATABASE_URL: 'sqlite:data/studio.db'
      YOUTUBE_PROVIDER: real
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      # Telegram assistant (Cloudflare Worker): live report / video list / viral alerts, refreshed hourly
      BOT_URL: ${{ secrets.BOT_URL }}
      BOT_INGEST_SECRET: ${{ secrets.BOT_INGEST_SECRET }}
    steps:
      - name: Skip when Facebook/Instagram are not connected
        id: gate
        run: |
          if [ -z "$META_PAGE_ID" ] || [ -z "$META_PAGE_TOKEN" ]; then echo "connected=false" >> "$GITHUB_OUTPUT"; echo "Meta not connected yet."; else echo "connected=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.connected == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.connected == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts
        if: steps.gate.outputs.connected == 'true'
      - name: Read the latest state (read-only)
        if: steps.gate.outputs.connected == 'true'
        run: |
          mkdir -p data
          git fetch -q origin state && git show origin/state:studio.db > data/studio.db || true
      - name: Post due Reels
        if: steps.gate.outputs.connected == 'true'
        run: node --no-warnings src/cli/index.ts social ${{ inputs.check && '--check' || '' }}
      - name: Refresh the Telegram assistant (live numbers, videos, viral alerts)
        if: steps.gate.outputs.connected == 'true' && env.BOT_URL != ''
        continue-on-error: true
        run: node --no-warnings src/cli/index.ts bot:sync
