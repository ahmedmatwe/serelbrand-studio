# Runs the autopilot in the cloud (GitHub Actions) — the Mac can be off.
# State (SQLite DB + daily reports) lives on the `state` branch; secrets come from repository secrets.
name: autopilot

on:
  schedule:
    - cron: '20 */3 * * *'   # every 3 hours (UTC)
  workflow_dispatch:
    inputs:
      force:
        description: 'Produce a video now (ignore the one-per-day limit)'
        type: boolean
        default: false
      format:
        description: 'With force: long or short (empty = what is due)'
        type: string
        default: ''

concurrency:
  group: autopilot
  cancel-in-progress: false

permissions:
  contents: write   # save state to the `state` branch
  issues: write     # notifications → issue comment → email
  actions: write    # the week's Shorts (artifacts) + the watchdog re-runs a failed social/bot run

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      DRY_RUN: 'false'
      FREE_ONLY: 'true'
      LLM_PROVIDER: gemini
      TTS_PROVIDER: gemini
      STOCK_PROVIDER: pixabay
      # Free-only mode disables potentially billable AI image generation; thumbnails use owned/stock assets.
      IMAGE_PROVIDER: mock
      YOUTUBE_PROVIDER: real
      AUTO_VERIFY: 'true'
      AUTO_APPROVE: 'true'
      ALLOW_PUBLIC_PUBLISHING: 'true'
      ARABIC_FONT: Noto Naskh Arabic
      LOG_LEVEL: info
      WHISPER_MODEL: small
      WHISPER_PYTHON: python
      GEMINI_MODEL_WRITING: gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash,gemini-3-flash-preview,gemini-flash-latest,gemini-3.5-flash-lite
      GEMINI_MODEL_LIGHT: gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-flash-lite-latest,gemini-3.5-flash,gemini-3.6-flash,gemini-3-flash-preview
      GEMINI_TTS_VOICE: Charon
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      # Facebook Page + Instagram cross-posting (empty = off). The queue uses this run's GitHub token.
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
      TIKTOK_PRIVACY_LEVEL: ${{ secrets.TIKTOK_PRIVACY_LEVEL }}
      # TikTok through Buffer (empty = off); videos are served to Buffer from the bot's /media link.
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_KEY_EXPIRES: ${{ vars.BUFFER_KEY_EXPIRES }}
      GITHUB_TOKEN: ${{ github.token }}
      # Telegram reporting bot (videos + notifications); empty = off
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BOT_URL: ${{ secrets.BOT_URL }}
      BOT_INGEST_SECRET: ${{ secrets.BOT_INGEST_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Arabic fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core > /dev/null && fc-list | grep -i "naskh arabic" | head -1

      - run: npm ci --no-audit --no-fund
      # Motion-graphics Shorts (Remotion) need a headless Chrome; if this fails those Shorts fall back to stock footage.
      - run: npx remotion browser ensure
        continue-on-error: true

      # Speech alignment (free, local): listens to the narration so captions, scene cuts and shots follow the
      # exact spoken words, and catches a voice that does not say the script.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - uses: actions/cache@v4
        with:
          path: data/prop-cache
          key: props-v1-${{ github.run_id }}
          restore-keys: props-v1-
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ env.WHISPER_MODEL }}-v1

      - name: Speech alignment model
        run: |
          pip install -q -r scripts/requirements.txt
          python -c "from faster_whisper import WhisperModel; WhisperModel('$WHISPER_MODEL', device='cpu', compute_type='int8'); print('whisper ready')"
          # Smoke test of the exact command the renderer runs (prints the error if transcription fails).
          node_modules/ffmpeg-static/ffmpeg -loglevel error -f lavfi -i "sine=f=440:d=2" -ar 24000 -ac 1 /tmp/align-smoke.wav
          $WHISPER_PYTHON scripts/align.py /tmp/align-smoke.wav ar | tail -c 300; echo

      - name: Restore state (private repo serelbrand-state)
        env:
          STATE_REPO_TOKEN: ${{ secrets.STATE_REPO_TOKEN }}
        run: |
          mkdir -p data reports/daily
          touch data/studio.db.start   # renders newer than this are this run's
          # The channel's memory lives in a PRIVATE repo. Never start "fresh" by accident: a failed clone stops
          # the run (a fresh DB saved over the real one would wipe the channel's history).
          [ -n "$STATE_REPO_TOKEN" ] || { echo "::error::STATE_REPO_TOKEN secret is missing"; exit 1; }
          rm -rf /tmp/state-repo
          git clone -q --depth 1 "https://x-access-token:${STATE_REPO_TOKEN}@github.com/ahmedmatwe/serelbrand-state.git" /tmp/state-repo
          cp /tmp/state-repo/studio.db data/studio.db
          mkdir -p reports music
          cp -r /tmp/state-repo/reports/. reports/ 2>/dev/null || true
          cp -r /tmp/state-repo/music/. music/ 2>/dev/null || true
          echo "state restored ($(du -h data/studio.db | cut -f1), $(ls music | wc -l) music files)"

      - name: The week's Shorts (Friday evening, for the weekly compilation)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fridays from 19:00 UTC (21:00 Cairo) only; the app skips if this week's compilation is already up.
          [ "$(date -u +%u)" = 5 ] && [ "$(date -u +%H)" -ge 19 ] || exit 0
          since=$(date -u -d '8 days ago' +%FT%TZ)
          mkdir -p data/weekly-in
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            -q ".artifacts[] | select(.name | startswith(\"shorts-\")) | select(.expired | not) | select(.created_at > \"$since\") | .workflow_run.id" \
            | sort -u | while read id; do gh run download "$id" -p 'shorts-*' -D data/weekly-in/ 2>/dev/null || true; done
          find data/weekly-in -name '*.mp4' | wc -l

      - name: Autopilot cycle
        env:
          FORCE_PRODUCE: ${{ inputs.force || 'false' }}
          FORCE_FORMAT: ${{ inputs.format || '' }}
        run: node --no-warnings src/cli/index.ts autopilot

      - name: Save state (private repo serelbrand-state)
        if: always()
        run: |
          [ -f data/studio.db ] && [ -d /tmp/state-repo/.git ] || exit 0
          cd /tmp/state-repo
          git config user.name "serelbrand-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/data/studio.db" studio.db
          mkdir -p reports && cp -r "$GITHUB_WORKSPACE/reports/daily" "$GITHUB_WORKSPACE/reports/packages" reports/ 2>/dev/null || true
          git add -A && (git diff --cached --quiet || git commit -qm "state: $(date -u +%FT%H:%MZ)")
          for i in 1 2 3; do git push -q origin HEAD:main && break; git pull -q --rebase -X theirs origin main || true; done

      - name: Notify
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s data/notify.md ] || exit 0
          n=$(gh issue list --label autopilot --state open --json number -q '.[0].number')
          if [ -z "$n" ]; then
            gh label create autopilot --color F5B700 --force > /dev/null
            n=$(gh issue create --title "سر البراند — إشعارات التشغيل التلقائي" --label autopilot --body "كل تحديثات النظام بتظهر هنا (وبتوصلك على الإيميل)." | grep -o '[0-9]*$')
          fi
          gh issue comment "$n" --body-file data/notify.md

      - name: Keep this run's Shorts 9 days (for the weekly compilation)
        if: always()
        run: |
          mkdir -p keep
          for v in $(find data/renders -maxdepth 1 -mindepth 1 -type d -newer data/studio.db.start 2>/dev/null); do
            ls "$v"/short-*.mp4 > /dev/null 2>&1 || continue
            mkdir -p "keep/$(basename "$v")" && cp "$v"/short-*.mp4 "keep/$(basename "$v")/"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shorts-${{ github.run_id }}
          path: keep
          retention-days: 9
          if-no-files-found: ignore
          compression-level: 0

      - name: Sample frames (for checking Arabic text)
        if: always()
        run: |
          mkdir -p preview
          for v in $(ls -td data/renders/*/ 2>/dev/null | head -1); do
            [ -f "$v/thumbnail.png" ] && cp "$v/thumbnail.png" preview/ || true
            f=$(ls "$v"/*.mp4 2>/dev/null | head -1); [ -n "$f" ] && node_modules/ffmpeg-static/ffmpeg -loglevel error -ss 3 -i "$f" -frames:v 1 preview/frame.png || true
            # The full videos too, so a blocked video can still be watched (kept 3 days).
            cp "$v"/*.mp4 preview/ 2>/dev/null || true
            cp reports/packages/*"$(basename "$v")".md preview/ 2>/dev/null || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview
          path: preview
          retention-days: 3
          if-no-files-found: ignore
