# Renders a short motion-graphics sample on the runner (Chrome, fonts, Remotion) — run after changing motion/.
name: motion-check
on:
  workflow_dispatch:
    inputs:
      fix:
        description: 'Started from the «🔧 إصلاح» button on Telegram (the result is sent back)'
        type: string
        default: ''
  push:
    paths: ['motion/**', 'remotion.config.ts']
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx remotion browser ensure
      - run: npx remotion render motion/index.ts MotionShort sample.mp4 --public-dir=motion/public --codec=h264 --log=error
      - run: ls -la sample.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: motion-sample
          path: sample.mp4

      - name: Fix result → Telegram
        if: always() && inputs.fix != ''
        env:
          FIX: ${{ inputs.fix }}
          STATUS: ${{ job.status }}
          BOT_URL: ${{ secrets.BOT_URL }}
          BOT_INGEST_SECRET: ${{ secrets.BOT_INGEST_SECRET }}
        run: |
          if [ "$STATUS" = success ]; then t="✅ الإصلاح «$FIX» خلص بنجاح."; else t="❌ الإصلاح «$FIX» ما نجحش — هبص عليه وأبلّغك."; fi
          [ -n "$BOT_URL" ] && curl -s -m 20 -X POST "${BOT_URL%/}/ingest" -H "authorization: Bearer $BOT_INGEST_SECRET" -H 'content-type: application/json' \
            -d "$(jq -n --arg t "$t" '{messages:[$t]}')" > /dev/null || true
