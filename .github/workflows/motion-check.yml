# Renders a short motion-graphics sample on the runner (Chrome, fonts, Remotion) — run after changing motion/.
name: motion-check
on:
  workflow_dispatch:
  push:
    paths: ['motion/**', 'remotion.config.ts']
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx remotion browser ensure
      - run: npx remotion render motion/index.ts MotionShort sample.mp4 --public-dir=motion/public --codec=h264 --log=error
      - run: ls -la sample.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: motion-sample
          path: sample.mp4
