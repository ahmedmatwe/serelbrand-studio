# Manual check that the Cloudflare secrets work (one small test image, uploaded as an artifact).
name: check-keys
on: workflow_dispatch
permissions:
  contents: read
jobs:
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci --no-audit --no-fund
      - run: node --no-warnings scripts/check-cloudflare.ts
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: cloudflare-test, path: preview, if-no-files-found: ignore, retention-days: 3 }
  gemini:
    runs-on: ubuntu-latest
    steps:
      - name: Each Gemini key answers (text + voice), status only
        env:
          K1: ${{ secrets.GEMINI_API_KEY }}
          K2: ${{ secrets.GEMINI_API_KEY_2 }}
        run: |
          for n in 1 2; do
            k=$([ $n = 1 ] && echo "$K1" || echo "$K2")
            [ -n "$k" ] || { echo "key $n: missing"; continue; }
            t=$(curl -s -o /dev/null -w '%{http_code}' -H "x-goog-api-key: $k" -H 'content-type: application/json' \
              -d '{"contents":[{"parts":[{"text":"قول أهلاً"}]}]}' https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-lite-latest:generateContent)
            v=$(curl -s -o /dev/null -w '%{http_code}' -H "x-goog-api-key: $k" -H 'content-type: application/json' \
              -d '{"contents":[{"parts":[{"text":"أهلاً"}]}],"generationConfig":{"responseModalities":["AUDIO"],"speechConfig":{"voiceConfig":{"prebuiltVoiceConfig":{"voiceName":"Charon"}}}}}' \
              https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash-tts:generateContent)
            echo "key $n: text HTTP $t · voice HTTP $v"
          done
  facebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node --no-warnings scripts/check-facebook.ts
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
